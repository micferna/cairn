name: CI

# Les actions sont épinglées à un SHA de commit, pas à un tag.
#
# Un tag Git est déplaçable : quiconque prend le contrôle d'un dépôt d'action
# peut faire pointer `v7` vers du code arbitraire, qui s'exécuterait ici avec
# accès aux secrets du dépôt — dont la clé de signature de l'application. Un
# SHA, lui, ne bouge pas. Le commentaire à droite donne la version lisible ;
# Dependabot met à jour les deux ensemble.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # Analyse statique : code mort, doublons, complexité, bugs latents.
      # La configuration n'autorise aucune règle désactivée et exige zéro
      # problème (config/detekt.yml, build.maxIssues = 0).
      - name: Detekt
        run: ./gradlew detekt

      # Android Lint en mode strict : warningsAsErrors = true.
      # Couvre aussi les API dépréciées et les défauts de sécurité.
      - name: Android Lint
        run: ./gradlew lintDebug lintRelease

      - name: Compiler
        run: ./gradlew assembleDebug assembleRelease

      # La garantie centrale du projet, vérifiée sur l'artefact réel plutôt
      # qu'affirmée dans le README.
      - name: Vérifier l'absence de permission réseau
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -r | head -1)
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          PERMS=$("$AAPT" dump permissions "$APK")
          printf '%s\n' "$PERMS"
          if printf '%s' "$PERMS" | grep -qE 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)'; then
            echo "::error::Une permission réseau est apparue dans l'APK."
            exit 1
          fi
          echo "OK — aucune permission réseau."

      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapports-qualite
          path: |
            build/reports/detekt/
            app/build/reports/
          if-no-files-found: ignore

      - name: Remonter les rapports SARIF dans l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: build/reports/detekt/detekt.sarif
          category: detekt
        continue-on-error: true
