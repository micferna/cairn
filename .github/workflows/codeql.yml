name: CodeQL

# Analyse de sécurité du code source par GitHub. Complémentaire de detekt :
# CodeQL suit les flux de données et détecte les classes de vulnérabilités
# (injections, désérialisation, fuites) que l'analyse syntaxique ne voit pas.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Un passage hebdomadaire attrape les vulnérabilités publiées après le
    # dernier commit, sur un code qui n'aurait pas bougé.
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # CodeQL analyse le code en observant la compilation. Il faut donc que la
      # compilation ait réellement lieu : avec le cache Gradle restauré et le
      # démon actif, la build ressort « à jour » et le traceur ne voit passer
      # aucun fichier — d'où le fameux « could not process any of it ».
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          queries: security-extended

      - name: Compiler
        run: ./gradlew clean assembleDebug --no-build-cache --no-daemon

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
